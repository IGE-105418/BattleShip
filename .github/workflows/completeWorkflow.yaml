name: Complete CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Verificar dependências
      - name: Verify dependencies
        run: mvn dependency:resolve --no-transfer-progress

      # 4. Compilar o projeto
      - name: Compile project
        run: mvn clean compile --no-transfer-progress

      # 5. Executar testes unitários
      - name: Run unit tests
        run: mvn test --no-transfer-progress

      # 6. Validar qualidade no SonarQube Cloud (requer SONAR_TOKEN configurado)
      - name: SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=IGE-105418_BattleShip \
            -Dsonar.organization=ige-105418 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            --no-transfer-progress
        continue-on-error: true

      # 7. Criar o JAR (fat jar via shade plugin)
      - name: Package JAR
        run: mvn package -DskipTests --no-transfer-progress

      # 8. Login no Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Construir a imagem Docker
      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:${{ github.sha }}

      # 10. Atualizar documentação no GitHub Pages
      - name: Generate Maven site
        run: mvn site --no-transfer-progress
        continue-on-error: true

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: .
